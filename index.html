<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Core - Secure Management Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* إخفاء الأسهم من حقل الأرقام */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-[#060913] text-slate-200 min-h-screen font-sans flex items-center justify-center p-4">

    <!-- حاوية الإشعارات -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <main class="w-full max-w-md bg-[#0b101f] border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 relative overflow-hidden">
        
        <div class="text-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-cyan-400 tracking-wider">ALPHA ADMIN</h1>
            <p class="text-xs text-slate-400 mt-2">Portail d'administration sécurisé</p>
        </div>

        <!-- الخطوة 1: تسجيل الدخول الأساسي -->
        <div id="step-1-login" class="space-y-4 text-xs font-bold transition-all duration-500 opacity-100">
            <div>
                <label class="text-slate-400 block mb-1.5 text-left">Nom d'utilisateur</label>
                <input type="text" id="auth-username" placeholder="fethi" class="w-full p-3.5 rounded-xl bg-[#04060c] border border-slate-800 text-white font-mono focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
                <label class="text-slate-400 block mb-1.5 text-left">Mot de passe</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full p-3.5 rounded-xl bg-[#04060c] border border-slate-800 text-white font-mono focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <button onclick="handleLoginStep1()" id="btn-step-1" class="w-full bg-gradient-to-r from-rose-500 to-cyan-500 hover:from-rose-600 hover:to-cyan-600 text-slate-950 font-black p-4 rounded-xl transition-all shadow-lg text-sm uppercase tracking-wider">
                Connexion Système
            </button>
        </div>

        <!-- الخطوة 2: التحقق الثنائي (مخفية افتراضياً) -->
        <div id="step-2-2fa" class="space-y-4 text-xs font-bold hidden opacity-0 transition-all duration-500">
            <div class="text-center mb-4">
                <div class="inline-block p-3 rounded-full bg-cyan-900/30 text-cyan-400 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <p class="text-slate-300 text-sm">Vérification en deux étapes</p>
                <p class="text-slate-500 text-xs font-normal mt-1">Ouvrez Google Authenticator et saisissez le code à 6 chiffres.</p>
            </div>
            
            <div>
                <input type="number" id="auth-2fa-code" placeholder="000000" class="w-full p-4 rounded-xl bg-[#04060c] border-2 border-cyan-800/50 text-cyan-400 font-mono text-center text-2xl tracking-[0.5em] focus:outline-none focus:border-cyan-400 transition-colors">
            </div>
            
            <button onclick="handleLoginStep2()" id="btn-step-2" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-black p-4 rounded-xl transition-all shadow-lg text-sm uppercase tracking-wider">
                Vérifier & Entrer
            </button>
            
            <button onclick="resetToStep1()" class="w-full text-slate-500 hover:text-slate-300 font-normal mt-2 underline decoration-slate-700 underline-offset-4">
                Retour
            </button>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        let validUsername = ""; // متغير سري لحفظ الاسم بين الخطوتين

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-2xl border text-xs font-bold text-slate-950 flex items-center gap-2 ${type === 'success' ? 'bg-emerald-400 border-emerald-500' : 'bg-rose-400 border-rose-500'}`;
            toast.innerHTML = type === 'success' ? `✅ ${message}` : `❌ ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // --- الخطوة 1: فحص كلمة السر ---
        async function handleLoginStep1() {
            const usernameInput = document.getElementById('auth-username').value.trim();
            const passwordInput = document.getElementById('auth-password').value;
            const btn = document.getElementById('btn-step-1');
            
            if(!usernameInput || !passwordInput) return showNotification('Veuillez remplir tous les champs !', 'error');

            btn.disabled = true;
            btn.innerHTML = 'Connexion...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username: usernameInput, password: passwordInput }) 
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    btn.disabled = false;
                    btn.innerHTML = 'Connexion Système';
                    return showNotification(data.detail || 'Erreur de connexion', 'error');
                }
                
                // نجاح الخطوة الأولى: نحفظ الاسم وننتقل للخطوة الثانية بلمسة أنيقة
                validUsername = data.username;
                
                const step1 = document.getElementById('step-1-login');
                const step2 = document.getElementById('step-2-2fa');
                
                step1.classList.add('opacity-0');
                setTimeout(() => {
                    step1.classList.add('hidden');
                    step2.classList.remove('hidden');
                    // تأخير بسيط لإعطاء تأثير الظهور
                    setTimeout(() => {
                        step2.classList.remove('opacity-0');
                        document.getElementById('auth-2fa-code').focus(); // وضع المؤشر في حقل الكود تلقائياً
                    }, 50);
                }, 500);

            } catch(e){ 
                btn.disabled = false;
                btn.innerHTML = 'Connexion Système';
                showNotification('Erreur de communication avec le serveur', 'error'); 
            }
        }

        // --- الخطوة 2: التحقق من كود 2FA ---
        async function handleLoginStep2() {
            const codeInput = document.getElementById('auth-2fa-code').value.trim();
            const btn = document.getElementById('btn-step-2');

            if(!codeInput || codeInput.length < 6) return showNotification('Code invalide !', 'error');

            btn.disabled = true;
            btn.innerHTML = 'Vérification...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/verify-2fa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: validUsername, totp_code: codeInput })
                });
                
                const finalData = await res.json();
                
                if (!res.ok) {
                    btn.disabled = false;
                    btn.innerHTML = 'Vérifier & Entrer';
                    return showNotification(finalData.detail || 'Code Google Authenticator incorrect!', 'error');
                }

                if(finalData.role === 'player') {
                    btn.disabled = false;
                    btn.innerHTML = 'Vérifier & Entrer';
                    return showNotification('Accès refusé.', 'error');
                }

                // التوثيق الناجح!
                localStorage.setItem('alpha_user', JSON.stringify(finalData));
                if (finalData.access_token) {
                    localStorage.setItem('token', finalData.access_token);
                }
                
                showNotification('Authentification réussie !', 'success');
                
                setTimeout(() => {
                    if (finalData.username === 'fethi' || finalData.role.toLowerCase() === 'owner') {
                        window.location.href = '/panel/owner';
                    } else if (finalData.role === 'super_admin') {
                        window.location.href = '/panel/super_admin';
                    } else if (finalData.role === 'admin') {
                        window.location.href = '/panel/admin';
                    } else if (finalData.role === 'shop') {
                        window.location.href = '/panel/shop';
                    }
                }, 500);

            } catch(e) {
                btn.disabled = false;
                btn.innerHTML = 'Vérifier & Entrer';
                showNotification('Erreur réseau', 'error');
            }
        }

        // للعودة للخطوة الأولى إذا أخطأ المستخدم
        function resetToStep1() {
            const step1 = document.getElementById('step-1-login');
            const step2 = document.getElementById('step-2-2fa');
            const btn1 = document.getElementById('btn-step-1');
            
            btn1.disabled = false;
            btn1.innerHTML = 'Connexion Système';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-2fa-code').value = '';

            step2.classList.add('opacity-0');
            setTimeout(() => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                setTimeout(() => {
                    step1.classList.remove('opacity-0');
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
