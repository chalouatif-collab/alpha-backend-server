<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Core - Manager Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .manager-header { background: linear-gradient(90deg, #1a237e 0%, #0d47a1 100%); border-bottom: 2px solid #2962ff; }
        .card-mini { background-color: #161625; border: 1px solid #283593; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn-mini { padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; }
        .form-control-mini, .form-select-mini { background-color: #0a0a0f; border: 1px solid #3949ab; color: #fff; font-size: 0.85rem; padding: 5px; }
        .form-control-mini:focus { border-color: #536dfe; box-shadow: none; color: white; }
        .text-manager { color: #8c9eff !important; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="manager-header p-2 d-flex justify-content-between align-items-center shadow-sm">
        <div class="fw-bold text-white fs-5">
            <i class="fa-solid fa-chess-knight me-2"></i> ALPHA MANAGER
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-dark border border-primary fs-6"><i class="fa-solid fa-wallet"></i> <span id="my-balance">0.00</span> TND</span>
            <button onclick="logout()" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-power-off"></i> خروج</button>
        </div>
    </header>

    <main class="container-fluid p-3">
        <div class="row">
            
            <!-- العمود الأيمن: التحكم المالي والإنشاء -->
            <div class="col-md-4">
                <!-- شحن وسحب سريع -->
                <div class="card-mini border-start border-primary border-3">
                    <h6 class="text-manager fw-bold mb-3"><i class="fa-solid fa-money-bill-transfer"></i> الشحن والسحب السريع</h6>
                    <div class="row g-2">
                        <div class="col-12">
                            <input type="text" id="tx-username" class="form-control form-control-mini" placeholder="اسم المستخدم (اللاعب أو الوكيل)">
                        </div>
                        <div class="col-12">
                            <input type="number" id="tx-amount" class="form-control form-control-mini" placeholder="المبلغ (TND)">
                        </div>
                        <div class="col-6">
                            <button onclick="processTransaction('charge')" class="btn btn-success w-100 btn-mini fw-bold">شحن (+)</button>
                        </div>
                        <div class="col-6">
                            <button onclick="processTransaction('withdraw')" class="btn btn-danger w-100 btn-mini fw-bold">سحب (-)</button>
                        </div>
                    </div>
                </div>

                <!-- إنشاء حساب جديد -->
                <div class="card-mini border-start border-info border-3">
                    <h6 class="text-info fw-bold mb-3"><i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد</h6>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="text" id="new-username" class="form-control form-control-mini" placeholder="اسم المستخدم">
                        </div>
                        <div class="col-6">
                            <input type="password" id="new-password" class="form-control form-control-mini" placeholder="كلمة المرور">
                        </div>
                        <div class="col-12">
                            <select id="new-role" class="form-select form-select-mini">
                                <option value="super_admin">Super Admin</option>
                                <option value="admin">Admin</option>
                                <option value="shop">Shop</option>
                                <option value="player" selected>Player (لاعب)</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button onclick="createUser()" class="btn btn-info w-100 btn-mini text-dark fw-bold">إنشاء الحساب</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- العمود الأيسر: الطلبات المعلقة وقائمة المستخدمين -->
            <div class="col-md-8">
                <!-- الأرباح الضخمة (Huge Wins) -->
                <div class="card-mini border-start border-warning border-3 mb-3">
                    <h6 class="text-warning fw-bold mb-2"><i class="fa-solid fa-triangle-exclamation"></i> جدار الحماية: الأرباح الضخمة المعلقة</h6>
                    <div class="table-responsive">
                        <table class="table table-dark table-sm table-hover align-middle mb-0" style="font-size: 0.8rem;">
                            <thead>
                                <tr class="text-secondary">
                                    <th>ID</th>
                                    <th>اللاعب</th>
                                    <th>المبلغ</th>
                                    <th>إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="huge-wins-tbody">
                                <!-- يتم الحقن هنا -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- قائمة شبكة المستخدمين -->
                <div class="card-mini border-start border-secondary border-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-white fw-bold m-0"><i class="fa-solid fa-users"></i> شبكة الحسابات</h6>
                        <input type="text" id="search-users" class="form-control form-control-mini w-25" placeholder="بحث..." onkeyup="filterUsers()">
                    </div>
                    <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-dark table-sm table-hover align-middle" style="font-size: 0.8rem;">
                            <thead class="position-sticky top-0 bg-dark">
                                <tr class="text-secondary">
                                    <th>المستخدم</th>
                                    <th>الرتبة</th>
                                    <th>الرصيد</th>
                                    <th>بواسطة</th>
                                    <th>إعدادات</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody">
                                <!-- يتم الحقن هنا -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const BACKEND_URL = window.location.origin;
        
        function getAuthHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem('alpha_token')}`
            };
        }

        async function fetchDashboardData() {
    try {
        // جلب الرصيد
        const uName = localStorage.getItem('alpha_username');
        const usersRes = await fetch(`${BACKEND_URL}/api/admin/users`, { headers: getAuthHeaders() });
        
        // تصحيح الخطأ: فصل استخراج البيانات عن حفظها في النافذة (window)
        const users = await usersRes.json();
        window.allUsers = users;
        
        const me = users.find(u => u.username === uName);
        if(me) document.getElementById('my-balance').innerText = parseFloat(me.balance).toFixed(2);

        renderUsers(users);
        fetchHugeWins();
    } catch (e) {
        if(e && e.message && e.message.includes("401")) logout();
    }
}

        function renderUsers(users) {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';
            users.forEach(u => {
                let roleColor = u.role === 'player' ? 'text-success' : 'text-warning';
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${u.username}</td>
                        <td class="${roleColor}">${u.role.toUpperCase()}</td>
                        <td class="font-mono">${parseFloat(u.balance).toFixed(2)}</td>
                        <td class="text-secondary">${u.created_by || 'system'}</td>
                        <td>
                            <button onclick="document.getElementById('tx-username').value='${u.username}'" class="btn btn-mini btn-outline-primary py-0"><i class="fa-solid fa-wallet"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterUsers() {
            const query = document.getElementById('search-users').value.toLowerCase();
            const filtered = window.allUsers.filter(u => u.username.toLowerCase().includes(query));
            renderUsers(filtered);
        }

        async function processTransaction(action) {
            const target = document.getElementById('tx-username').value;
            const amount = document.getElementById('tx-amount').value;
            if(!target || !amount) return alert("يرجى ملء كافة الحقول");

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        admin_username: localStorage.getItem('alpha_username'),
                        target_username: target,
                        action: action,
                        amount: parseFloat(amount)
                    })
                });
                const data = await res.json();
                if(res.ok) {
                    alert("✅ تمت العملية بنجاح");
                    document.getElementById('tx-amount').value = '';
                    fetchDashboardData();
                } else alert("❌ " + data.detail);
            } catch (e) { alert("خطأ في الاتصال"); }
        }

        async function createUser() {
            const username = document.getElementById('new-username').value;
            const pass = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;
            if(!username || !pass) return alert("أدخل اسم المستخدم وكلمة المرور");

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        username: username,
                        password: pass,
                        role: role,
                        created_by: localStorage.getItem('alpha_username'),
                        phone: "00000000"
                    })
                });
                if(res.ok) {
                    alert("✅ تم إنشاء الحساب بنجاح");
                    fetchDashboardData();
                } else {
                    const data = await res.json();
                    alert("❌ " + data.detail);
                }
            } catch (e) { alert("خطأ"); }
        }

        async function fetchHugeWins() {
            const res = await fetch(`${BACKEND_URL}/api/admin/pending-huge-wins`, { headers: getAuthHeaders() });
            const wins = await res.json();
            const tbody = document.getElementById('huge-wins-tbody');
            tbody.innerHTML = wins.length ? '' : '<tr><td colspan="4" class="text-center text-secondary">لا توجد أرباح ضخمة معلقة</td></tr>';
            
            wins.forEach(w => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${w.id}</td>
                        <td class="fw-bold text-info">${w.target_username}</td>
                        <td class="fw-bold text-success">${w.amount} TND</td>
                        <td>
                            <button onclick="handleHugeWin(${w.id}, 'approve')" class="btn btn-mini btn-success py-0">موافقة</button>
                            <button onclick="handleHugeWin(${w.id}, 'reject')" class="btn btn-mini btn-danger py-0">رفض</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function handleHugeWin(id, decision) {
            if(!confirm("هل أنت متأكد من هذا الإجراء؟")) return;
            const res = await fetch(`${BACKEND_URL}/api/admin/handle-huge-win`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ tx_id: id, decision: decision })
            });
            if(res.ok) {
                alert("✅ تمت معالجة الربح الضخم");
                fetchDashboardData();
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // تشغيل أولي
        if(!localStorage.getItem('alpha_token')) logout();
        else fetchDashboardData();
    </script>
</body>
</html>
