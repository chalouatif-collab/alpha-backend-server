<!DOCTYPE html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Core - Super Admin Control Centre</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* الألوان المخصصة - الهوية الزمردية الموحدة */
        :root {
            --emerald-primary: #10b981;
            --emerald-hover: #059669;
            --bg-main: #060913;
            --bg-sidebar: #090d1a;
            --bg-card: #0b101f;
            --bg-input: #0f172a; 
            --border-dark: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* تنسيقات مخصصة مدمجة (Compact) */
        .bg-card-custom { background-color: var(--bg-card); }
        .bg-input-custom { background-color: var(--bg-input); }
        .border-custom { border: 1px solid var(--border-dark); }
        .text-emerald { color: var(--emerald-primary) !important; }
        
        /* الأزرار الخضراء */
        .btn-emerald {
            background-color: var(--emerald-primary);
            color: #060913;
            font-weight: 900;
            border: none;
            transition: all 0.3s;
        }
        .btn-emerald:hover {
            background-color: var(--emerald-hover);
            color: #060913;
            transform: translateY(-1px);
        }

        /* حقول الإدخال */
        .form-control, .form-select {
            background-color: var(--bg-input) !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important; 
            font-family: monospace;
            font-weight: bold;
        }
        .form-control::placeholder {
            color: #64748b !important;
            font-weight: normal;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1e293b !important;
            border-color: var(--emerald-primary) !important;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.25) !important;
        }

        /* القائمة الجانبية */
        .sidebar-link {
            color: #cbd5e1;
            background-color: rgba(11, 16, 31, 0.6);
            border: 1px solid rgba(30, 41, 59, 0.6);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .sidebar-link:hover {
            background-color: #1e293b;
            color: #fff;
        }
        .active-shop-btn {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--emerald-primary) !important;
            color: var(--emerald-primary) !important;
        }

        /* إخفاء شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .offcanvas { background-color: var(--bg-sidebar); border-right: 1px solid var(--border-dark); }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: #e2e8f0 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        input[type=range] {
            accent-color: var(--emerald-primary);
        }
    </style>
</head>
<body class="d-flex flex-column flex-md-row min-vh-100">

    <!-- حاوية الإشعارات -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1090; width: 100%; max-width: 350px;"></div>

    <!-- القائمة الجانبية (للكمبيوتر) -->
    <aside class="d-none d-md-flex flex-column justify-content-between p-3" style="width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-dark);">
        <div class="d-flex flex-column gap-3">
            <div class="bg-card-custom border-custom rounded-2 p-2 d-flex align-items-center justify-content-between">
                <span class="small fw-bold text-secondary" style="font-size: 0.75rem;"><i class="fa-solid fa-globe"></i> Langue:</span>
                <select id="lang-select" onchange="changeLanguage(this.value)" class="form-select form-select-sm w-auto border-0 shadow-none cursor-pointer" style="font-size: 0.75rem;">
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div>
                <p class="text-secondary fw-black small mb-2 text-uppercase" style="letter-spacing: 1px; font-size: 0.7rem;" id="menu-title">Gestion Super Admin</p>
                <nav id="sadmin-sidebar-nav" class="d-flex flex-column">
                    <button onclick="switchSadminPanelSection('reseau')" id="btn-sadmin-reseau" class="sidebar-link active-shop-btn">
                        👑 Accounts Created (الشبكة)
                    </button>
                    <button onclick="switchSadminPanelSection('casino')" id="btn-sadmin-casino" class="sidebar-link">
                        🎰 Historique de casino
                    </button>
                    <button onclick="switchSadminPanelSection('transaction')" id="btn-sadmin-transaction" class="sidebar-link">
                        📊 Historique de transaction
                    </button>
                    <button onclick="switchSadminPanelSection('sport')" id="btn-sadmin-sport" class="sidebar-link">
                        ⚽ Tickets en cours
                    </button>
                    <button onclick="openPasswordModal()" class="btn text-start fw-bold w-100 border border-transparent hover-bg-dark mt-2 text-secondary" style="font-size: 0.75rem;">
                        🔑 Changement de mot de passe
                    </button>
                </nav>
            </div>
        </div>

        <div class="pt-2 border-top border-custom mt-auto">
            <button onclick="logout()" class="btn btn-sm w-100 fw-bold d-flex align-items-center justify-content-center gap-2" style="background-color: rgba(225, 29, 72, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185;" id="btn-logout">
                🚪 Déconnexion
            </button>
        </div>
    </aside>

    <!-- القائمة الجانبية (للهاتف - Offcanvas) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
        <div class="offcanvas-header border-bottom border-custom pb-2">
            <h6 class="offcanvas-title text-emerald fw-bold"><i class="fa-solid fa-bars-staggered"></i> ALPHA SUPER</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between p-3">
            <div class="d-flex flex-column gap-3">
                <nav id="sadmin-sidebar-nav-mobile" class="d-flex flex-column">
                    <button onclick="switchSadminPanelSection('reseau'); closeSidebarManually();" class="sidebar-link active-shop-btn">👑 Accounts Created</button>
                    <button onclick="switchSadminPanelSection('casino'); closeSidebarManually();" class="sidebar-link">🎰 Historique de casino</button>
                    <button onclick="switchSadminPanelSection('transaction'); closeSidebarManually();" class="sidebar-link">📊 Historique transaction</button>
                    <button onclick="switchSadminPanelSection('sport'); closeSidebarManually();" class="sidebar-link">⚽ Tickets en cours</button>
                </nav>
            </div>
            <div class="pt-2 border-top border-custom mt-auto">
                <button onclick="logout()" class="btn btn-sm w-100 fw-bold" style="background-color: rgba(225, 29, 72, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185;">🚪 Déconnexion</button>
            </div>
        </div>
    </div>

    <!-- منطقة المحتوى الرئيسية -->
    <div class="flex-grow-1 d-flex flex-column position-relative w-100">
        
        <!-- الهيدر العلوي -->
        <header class="bg-card-custom border-bottom border-custom px-3 py-1 d-flex justify-content-between align-items-center shadow-sm sticky-top">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm d-md-none border-0 text-white px-2 py-0 fs-5" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
                    ☰
                </button>
                <span class="badge text-emerald fw-bold px-2 py-1 border rounded-2" style="background-color: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); font-size: 0.65rem;">Super: <span id="owner-username">Connected</span></span>
            </div>
            <div class="border-custom px-2 py-0 rounded-2 d-flex align-items-center gap-2" style="background-color: #04060c;">
                <span class="text-secondary font-sans" style="font-size: 0.6rem;">الرصيد:</span>
                <span class="text-emerald fw-black font-monospace" style="font-size: 0.75rem;" id="sadmin-balance-val">0.00 TND</span>
            </div>
        </header>

        <!-- مساحة العمل -->
        <main class="flex-grow-1 overflow-y-auto p-2 p-md-3 no-scrollbar mx-auto w-100" style="max-width: 900px;">
            
            <!-- القسم 1: الشبكة (Network) -->
            <div id="panel-sadmin-reseau" class="sadmin-main-view d-flex flex-column gap-2">
                
                <!-- حقل البحث المصغر -->
                <div class="bg-input-custom rounded-2 border border-custom shadow-sm d-flex align-items-center p-1 px-2">
                    <span class="text-secondary" style="font-size: 0.8rem;"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="search-input" oninput="filterAdmins()" placeholder="بحث عن أدمن في الشبكة..." class="form-control form-control-sm border-0 bg-transparent text-white shadow-none" dir="rtl" style="font-size: 0.75rem;">
                </div>

                <!-- إنشاء حساب جديد (Compact) -->
                <section class="bg-card-custom border-custom rounded-2 p-2 shadow-sm border-start border-emerald border-3">
                    <h6 class="fw-bold text-white mb-2" dir="rtl" style="font-size: 0.8rem;" id="title-create-user">👑 إنشاء حساب أدمن جديد</h6>
                    <div class="row g-1 align-items-end">
                        <div class="col-6 col-md-3">
                            <input type="text" id="new-user-name" placeholder="Nom d'utilisateur" class="form-control form-control-sm font-monospace text-center">
                        </div>
                        <div class="col-6 col-md-3">
                            <input type="password" id="new-user-pass" placeholder="Mot de passe" class="form-control form-control-sm font-monospace text-center">
                        </div>
                        <div class="col-8 col-md-4 mt-1 mt-md-0">
                            <input type="text" id="new_phone" class="form-control form-control-sm font-monospace text-center" placeholder="Téléphone (+216...)">
                        </div>
                        <div class="col-4 col-md-2 mt-1 mt-md-0">
                            <button onclick="createAdminUser()" class="btn btn-emerald btn-sm w-100 fw-bold py-1" id="btn-create" style="font-size: 0.75rem;">تثبيت</button>
                        </div>
                    </div>
                </section>

                <!-- المعاملات المالية (Compact) -->
                <section id="financial-card" class="bg-card-custom border-custom rounded-2 p-2 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-custom pb-1 mb-2">
                        <h6 class="fw-bold text-white m-0" dir="rtl" style="font-size: 0.75rem;" id="title-table-console">📋 المعاملات المالية والبرمجية</h6>
                    </div>
                    
                    <div class="row g-1 mb-2 align-items-center">
                        <div class="col-md-3 col-6">
                            <input type="text" id="target-action-user" readonly placeholder="حدد أدمناً" class="form-control form-control-sm text-center text-emerald fw-bold" dir="rtl">
                        </div>
                        <div class="col-md-3 col-6">
                            <input type="number" id="target-action-amount" placeholder="المبلغ" class="form-control form-control-sm text-center font-monospace" dir="rtl">
                        </div>
                        <div class="col-md-3 col-6 mt-1 mt-md-0">
                            <button onclick="executeAction('charge')" id="btn-credit" class="btn btn-emerald btn-sm w-100 fw-bold py-1">شحن</button>
                        </div>
                        <div class="col-md-3 col-6 mt-1 mt-md-0">
                            <button onclick="executeAction('withdraw')" id="btn-retirer" class="btn btn-danger btn-sm w-100 fw-bold py-1">سحب</button>
                        </div>
                    </div>

                    <div class="row g-1 align-items-center">
                        <div class="col-12 col-md-6">
                            <div class="d-flex align-items-center gap-1 border border-custom rounded p-1 bg-input-custom">
                                <span class="text-secondary font-monospace fw-bold" style="font-size: 0.65rem; width: 45px;">RTP:<span id="rtp-val-label" class="ms-1 text-white">50%</span></span>
                                <input type="range" class="form-range flex-grow-1" id="ctrl-rtp-range" min="1" max="99" value="50" oninput="document.getElementById('rtp-val-label').innerText = this.value + '%'">
                                <button onclick="saveRtpAndBlock(0)" class="btn btn-sm btn-emerald py-0 px-2 fw-bold" style="font-size: 0.7rem;">حفظ</button>
                                <button onclick="saveRtpAndBlock(1)" class="btn btn-sm btn-danger py-0 px-2 fw-bold" style="font-size: 0.7rem;">حظر</button>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 mt-1 mt-md-0">
                            <div class="d-flex gap-1">
                                <input type="password" id="ctrl-admin-new-pass" placeholder="كلمة سر جديدة" class="form-control form-control-sm font-monospace text-center flex-grow-1" dir="rtl">
                                <button onclick="changeAdminPasswordFromSadmin()" class="btn btn-info btn-sm fw-bold px-3 py-1" style="font-size: 0.75rem;">تغيير</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- كروت الأدمنز (Compact) -->
                <div id="owner-network-list" class="d-flex flex-column gap-1 pb-4" style="max-height: 400px; overflow-y: auto;">
                    <!-- سيتم حقن الكروت هنا -->
                </div>
            </div>

            <!-- قسم 2: الكازينو -->
            <div id="panel-sadmin-casino" class="sadmin-main-view d-none">
                <div class="bg-card-custom border-custom rounded-2 p-4 text-center text-secondary shadow-sm">
                    <i class="fa-solid fa-ghost fs-2 mb-2"></i><br>
                    <span class="fw-bold text-uppercase" style="font-size: 0.75rem;">Aucun pari de casino enregistré pour vos branches admin.</span>
                </div>
            </div>

            <!-- قسم 3: التحويلات -->
            <div id="panel-sadmin-transfert" class="sadmin-main-view d-none">
                <div class="bg-card-custom border-custom rounded-2 p-4 text-center text-secondary shadow-sm">
                    <i class="fa-solid fa-money-bill-transfer fs-2 mb-2"></i><br>
                    <span class="fw-bold text-uppercase" style="font-size: 0.75rem;">Aucun transfert financier trouvé.</span>
                </div>
            </div>

            <!-- قسم 4: المعاملات -->
            <div id="panel-sadmin-transaction" class="sadmin-main-view d-none">
                <!-- سيتم حقن الفلتر والكروت هنا -->
            </div>

            <!-- قسم 5: الرياضة -->
            <div id="panel-sadmin-sport" class="sadmin-main-view d-none">
                <!-- سيتم حقن التذاكر هنا عبر دالة loadSportTickets -->
            </div>

        </main>
    </div>

    <!-- نافذة تعديل كلمة السر (Modal Bootstrap 5) -->
    <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content bg-card-custom border-custom text-white shadow">
                <div class="modal-header border-bottom border-custom py-2">
                    <h6 class="modal-title fw-bold" style="font-size: 0.85rem;"><i class="fa-solid fa-key text-emerald"></i> Modifier le mot de passe</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3">
                    <input type="password" id="new-sys-pass" placeholder="Nouveau mot de passe" class="form-control form-control-sm mb-2 font-monospace text-center">
                    <button onclick="submitNewPassword()" class="btn btn-emerald btn-sm w-100 fw-bold">Mettre à jour</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        let user = JSON.parse(localStorage.getItem('alpha_user')) || { username: 'fethi_sadmin', role: 'super_admin' };
        let allAdmins = [];

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        window.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('owner-username');
            if(el) el.innerText = user.username;
            loadNetworkData();
        });

        const translations = {
            fr: { menu: "Gestion Super Admin", create: "👑 Créer un nouveau compte ADMIN", console: "📋 Console de gestion (Finance)", credit: "Créditer", retirer: "Retirer", out: "Déconnexion" },
            ar: { menu: "إدارة السوبر أدمن", create: "👑 إنشاء حساب أدمن جديد", console: "📋 لوحة التحكم المالي", credit: "شحن رصيد", retirer: "سحب رصيد", out: "تسجيل الخروج" },
            en: { menu: "Super Admin Menu", create: "👑 Create a New Admin Account", console: "📋 Financial Control Console", credit: "Charge", retirer: "Withdraw", out: "Logout" }
        };

        function changeLanguage(lang) {
            document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('menu-title').innerText = translations[lang].menu;
            document.getElementById('title-create-user').innerText = translations[lang].create;
            document.getElementById('title-table-console').innerText = translations[lang].console;
            document.getElementById('btn-credit').innerText = translations[lang].credit;
            document.getElementById('btn-retirer').innerText = translations[lang].retirer;
            document.querySelectorAll('#btn-logout').forEach(btn => btn.innerHTML = `🚪 ${translations[lang].out}`);
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toastEl = document.createElement('div');
            const icon = type === 'success' ? '✅' : '❌';
            toastEl.className = `toast align-items-center text-bg-dark border-0 mb-2 show shadow-lg`;
            toastEl.setAttribute('role', 'alert'); toastEl.setAttribute('aria-live', 'assertive'); toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML = `
                <div class="d-flex ${type === 'success' ? 'border-success' : 'border-danger'} border-start border-3 rounded" style="background-color: var(--bg-card);">
                    <div class="toast-body fw-bold d-flex gap-2" style="font-size: 0.7rem; color: white;">
                        <span>${icon}</span> ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toastEl);
            setTimeout(() => { toastEl.remove(); }, 3000);
        }

        function closeSidebarManually() {
            const offcanvasElement = document.getElementById('mobileSidebar');
            if(offcanvasElement) {
                const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasElement);
                if(bsOffcanvas) bsOffcanvas.hide();
            }
        }

        function switchSadminPanelSection(sectionId) {
            document.querySelectorAll('.sadmin-main-view').forEach(el => { el.classList.remove('d-flex'); el.classList.add('d-none'); });
            document.querySelectorAll('.sidebar-link').forEach(btn => btn.classList.remove('active-shop-btn'));
            
            const targetSection = document.getElementById(`panel-sadmin-${sectionId}`);
            if (targetSection) {
                targetSection.classList.remove('d-none');
                if(sectionId === 'reseau') targetSection.classList.add('d-flex'); 
            }
            
            document.querySelectorAll(`[onclick*="switchSadminPanelSection('${sectionId}')"]`).forEach(btn => btn.classList.add('active-shop-btn'));

            if (sectionId === 'sport') loadSportTickets();
            if (sectionId === 'transaction') loadTransactions();
        }

        async function loadNetworkData() {
            try {
                const uRes = await fetch(`${BACKEND_URL}/api/admin/users`, { method: 'GET', headers: getAuthHeaders() });
                if(uRes.ok){
                    const users = await uRes.json();
                    const me = users.find(u => u.username === user.username);
                    if(me) {
                        user.balance = me.balance;
                        document.getElementById('sadmin-balance-val').innerText = `${parseFloat(user.balance).toFixed(2)} TND`;
                        localStorage.setItem('alpha_user', JSON.stringify(user));
                    }
                    allAdmins = users.filter(u => u.role === 'admin' && u.created_by === user.username);
                    renderAdminsList(allAdmins);
                }
            } catch(e){
                document.getElementById('owner-network-list').innerHTML = `<div class="text-center p-3 text-danger fw-bold" style="font-size: 0.75rem;">خطأ في الاتصال ❌</div>`;
            }
        }

        function renderAdminsList(adminsArray) {
            const listContainer = document.getElementById('owner-network-list'); 
            if(!listContainer) return;
            listContainer.innerHTML = '';
            
            if(adminsArray.length === 0) {
                listContainer.innerHTML = `<div class="bg-card-custom border-custom p-2 rounded-2 text-center text-secondary fw-bold" style="font-size: 0.75rem;">لا يوجد أدمنز تحت إدارتك.</div>`;
                return;
            }

            adminsArray.forEach(u => {
                const userRole = u.role ? u.role.toUpperCase() : 'ADMIN';
                const userRtp = u.rtp !== undefined && u.rtp !== null ? u.rtp : 50;
                const userBalance = u.balance !== undefined && u.balance !== null ? parseFloat(u.balance).toFixed(2) : "0.00";
                const statusDot = u.is_blocked === 1 ? 'bg-danger' : 'bg-success';
                
                const secretBadge = u.two_factor_secret
                ? `<div class="d-inline-flex align-items-center bg-dark border border-secondary rounded ms-2" style="max-width: 150px; overflow: hidden;" onclick="event.stopPropagation()">
                       <i class="fa-solid fa-key text-success px-1" style="font-size: 0.65rem;"></i>
                       <input type="text" value="${u.two_factor_secret}" class="bg-transparent border-0 text-warning p-0 m-0 text-center font-monospace" style="width: 80px; font-size: 0.65rem; outline: none;" readonly>
                       <button onclick="copySecretCode('${u.two_factor_secret}', event)" class="btn btn-sm btn-success rounded-0 py-0 px-2 m-0 border-0" title="نسخ الكود">
                           <i class="fa-regular fa-copy" style="font-size: 0.7rem;"></i>
                       </button>
                   </div>`
                : `<span class="badge bg-secondary text-white p-1 rounded ms-2" style="font-size: 0.65rem;"><i class="fa-solid fa-key"></i> Non activé</span>`;
                
                listContainer.innerHTML += `
                    <div class="bg-input-custom border-custom rounded-2 shadow-sm p-2 d-flex justify-content-between align-items-center cursor-pointer" onclick="selectForControl('${u.username}', ${userRtp})">
                        <div class="d-flex align-items-center gap-2">
                            <div class="position-relative bg-dark rounded-circle d-flex justify-content-center align-items-center border border-secondary" style="width: 28px; height: 28px;">
                                <i class="fa-solid fa-user text-secondary" style="font-size: 10px;"></i>
                                <span class="position-absolute top-0 start-100 translate-middle p-1 ${statusDot} border border-dark rounded-circle"></span>
                            </div>
                            <div>
                                <div class="text-white fw-bold mb-0 d-flex align-items-center" style="font-size: 0.75rem;">
                                    ${u.username} ${secretBadge}
                                </div>
                                <div class="text-emerald fw-bold" style="font-size: 0.6rem;">${userRole} | RTP: ${userRtp}%</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-white fw-bold font-monospace" style="font-size: 0.75rem;">${userBalance} TND</span>
                            <div class="btn btn-emerald rounded-1 d-flex align-items-center justify-content-center shadow-sm" style="width: 22px; height: 22px; padding: 0; font-size: 10px;">➜</div>
                        </div>
                    </div>`;
            });
        }

        function filterAdmins() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allAdmins.filter(admin => admin.username.toLowerCase().includes(query));
            renderAdminsList(filtered);
        }

        function selectForControl(username, rtp) {
            document.getElementById('target-action-user').value = username;
            document.getElementById('ctrl-rtp-range').value = rtp;
            document.getElementById('rtp-val-label').innerText = rtp + '%';
            document.getElementById('financial-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
            showNotification(`تم تحديد: ${username}`);
        }

        async function executeAction(action) {
            const target_username = document.getElementById('target-action-user').value;
            const amountInput = document.getElementById('target-action-amount').value;
            if(!target_username) return showNotification('الرجاء اختيار أدمن!', 'error');
            const amount = amountInput ? parseFloat(amountInput) : 0;
            if(amount <= 0) return showNotification('الرجاء إدخال مبلغ صحيح!', 'error');

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username, action, amount })
                });
                if(res.ok) { 
                    showNotification('تمت العملية بنجاح!'); 
                    document.getElementById('target-action-amount').value = ''; 
                    await loadNetworkData(); 
                } else { showNotification('فشلت العملية', 'error'); }
            } catch(e) { showNotification('خطأ في الاتصال', 'error'); }
        }

        async function createAdminUser() {
            const usernameInput = document.getElementById('new-user-name');
            const passwordInput = document.getElementById('new-user-pass');
            const phoneInput = document.getElementById('new_phone');

            const username = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const phone = phoneInput ? phoneInput.value.trim() : ''; 

            if(!username || !password) return showNotification('Remplir tous les champs!', 'error');

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username, password, role: 'admin', created_by: user.username, phone }) 
                });
                
                const data = await res.json(); 
                if(res.ok){
                    showNotification('Compte créé avec succès!', 'success');
                    usernameInput.value = ''; passwordInput.value = ''; if(phoneInput) phoneInput.value = '';
                    loadNetworkData();
                } else { showNotification(data.detail || 'Erreur', 'error'); }
            } catch(e) { showNotification('Erreur de connexion', 'error'); }
        }

        async function saveRtpAndBlock(blockStatus) {
            const target_username = document.getElementById('target-action-user').value;
            const rtp = parseInt(document.getElementById('ctrl-rtp-range').value);
            if(!target_username) return showNotification('الرجاء تحديد حساب أولاً!', 'error');
            
            const res = await fetch(`${BACKEND_URL}/api/admin/configure-account`, {
                method: 'POST', headers: getAuthHeaders(),
                body: JSON.stringify({ admin_username: user.username, target_username, rtp, is_blocked: blockStatus })
            });
            if(res.ok) { showNotification(blockStatus === 1 ? 'تم حظر الحساب' : 'تم حفظ الإعدادات'); loadNetworkData(); }
        }

        async function changeAdminPasswordFromSadmin() {
            const target = document.getElementById('target-action-user').value;
            const newPassword = document.getElementById('ctrl-admin-new-pass').value;
            if(!target || !newPassword || newPassword.length < 4) return showNotification('بيانات غير صحيحة', 'error');
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/change-player-password`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username: target, new_password: newPassword })
                });
                if(res.ok) {
                    showNotification(`تم تغيير كلمة السر بنجاح!`);
                    document.getElementById('ctrl-admin-new-pass').value = '';
                } else { showNotification('فشلت العملية', 'error'); }
            } catch(e) { showNotification('خطأ في الاتصال', 'error'); }
        }

        let allTransactionsCache = []; 

        async function loadTransactions() {
            const container = document.getElementById('panel-sadmin-transaction');
            container.innerHTML = '<div class="text-center p-3 text-emerald fw-bold" style="font-size: 0.75rem;">جاري جلب السجل... ⏳</div>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/transactions-history?username=${user.username}`, {
                    method: 'GET', headers: getAuthHeaders()
                });

                if (res.ok) {
                    allTransactionsCache = await res.json();
                    renderTransactionsUI(); 
                } else { container.innerHTML = '<div class="text-center p-3 text-danger fw-bold" style="font-size: 0.75rem;">فشل جلب المعاملات ❌</div>'; }
            } catch(e) { container.innerHTML = '<div class="text-center p-3 text-danger fw-bold" style="font-size: 0.75rem;">خطأ في الاتصال ❌</div>'; }
        }

        function renderTransactionsUI() {
            const container = document.getElementById('panel-sadmin-transaction');
            let html = `
                <div class="row g-1 mb-2 bg-card-custom border-custom p-2 rounded-2 shadow-sm align-items-end">
                    <div class="col-5">
                        <label class="text-secondary mb-1 fw-bold" style="font-size: 0.65rem;">من تاريخ:</label>
                        <input type="date" id="tx-start-date" class="form-control form-control-sm text-center" style="font-size: 0.7rem;">
                    </div>
                    <div class="col-5">
                        <label class="text-secondary mb-1 fw-bold" style="font-size: 0.65rem;">إلى تاريخ:</label>
                        <input type="date" id="tx-end-date" class="form-control form-control-sm text-center" style="font-size: 0.7rem;">
                    </div>
                    <div class="col-2">
                        <button onclick="applyDateFilter()" class="btn btn-emerald btn-sm w-100 fw-bold py-1" style="font-size: 0.7rem;"><i class="fa-solid fa-search"></i></button>
                    </div>
                </div>
                <div id="tx-list-container" class="d-flex flex-column gap-1 overflow-y-auto" style="max-height: 400px;"></div>
            `;
            container.innerHTML = html;
            displayFilteredTransactions(allTransactionsCache);
        }

        function applyDateFilter() {
            const startDate = document.getElementById('tx-start-date').value;
            const endDate = document.getElementById('tx-end-date').value;
            let filtered = allTransactionsCache;

            if (startDate || endDate) {
                filtered = allTransactionsCache.filter(t => {
                    const txDate = t.date ? t.date.split(' ')[0] : '';
                    if (!txDate) return false;
                    let isAfterStart = true;
                    let isBeforeEnd = true;
                    if (startDate) isAfterStart = txDate >= startDate;
                    if (endDate) isBeforeEnd = txDate <= endDate;
                    return isAfterStart && isBeforeEnd;
                });
            }
            displayFilteredTransactions(filtered);
        }

        function displayFilteredTransactions(transactions) {
            const listContainer = document.getElementById('tx-list-container');
            if (!transactions || transactions.length === 0) {
                listContainer.innerHTML = '<div class="bg-card-custom border-custom rounded p-3 text-center text-secondary fw-bold" style="font-size: 0.75rem;">لا توجد معاملات.</div>';
                return;
            }

            let html = '';
            transactions.forEach(t => {
                const isCharge = t.action === 'charge'; 
                const color = isCharge ? 'text-success' : 'text-danger';
                const sign = isCharge ? '+' : '-';
                const targetName = t.target_username || t.target || 'مجهول';
                const date = t.date || 'بدون تاريخ';
                
                html += `
                    <div class="bg-input-custom border-custom rounded-2 shadow-sm p-2 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-white fw-bold mb-0" style="font-size: 0.75rem;">👤 ${targetName}</div>
                            <div class="text-secondary font-monospace" style="font-size: 0.65rem;">🕒 ${date}</div>
                        </div>
                        <div class="text-end">
                            <div class="${color} fw-bold font-monospace mb-0" style="font-size: 0.8rem;">
                                ${sign}${parseFloat(t.amount).toFixed(2)} TND
                            </div>
                        </div>
                    </div>`;
            });
            listContainer.innerHTML = html;
        }

        async function loadSportTickets() {
            const container = document.getElementById('panel-sadmin-sport');
            container.innerHTML = '<div class="text-center p-3 text-emerald fw-bold" style="font-size: 0.75rem;">جاري جلب الأوراق... ⏳</div>';
            
            try {
                const usersRes = await fetch(`${BACKEND_URL}/api/admin/users?t=${Date.now()}`);
                if (!usersRes.ok) return;
                const users = await usersRes.json();
                const myUsers = users.filter(u => u.created_by === user.username).map(u => u.username);

                let allTicketsHtml = '';
                
                for (const target of myUsers) {
                    const ticketsRes = await fetch(`${BACKEND_URL}/api/admin/get-player-tickets?username=${encodeURIComponent(target)}&t=${Date.now()}`);
                    if (ticketsRes.ok) {
                        const tickets = await ticketsRes.json();
                        tickets.forEach(t => {
                            let badgeColor = t.status === "gagne" ? "text-success" : (t.status === "perdu" ? "text-danger" : (t.status === "cashout" ? "text-warning" : "text-info"));
                            let matchesHtml = Array.isArray(t.details_list) ? 
                                t.details_list.map(g => `• ${g.matchName} (<span class="text-warning">${g.outcome}</span>)`).join('<br>') : 
                                (t.match || "Match Inconnu");

                            allTicketsHtml += `
                                <div class="bg-input-custom border-custom rounded-2 mb-2 shadow-sm p-2 d-flex flex-column gap-2">
                                    <div class="text-white" style="font-size: 0.7rem; line-height: 1.4;">${matchesHtml}</div>
                                    <div class="text-end font-monospace border-top border-custom pt-1" style="font-size: 0.7rem;">
                                        <div class="text-secondary mb-0">Joueur: <span class="text-white fw-bold">${target}</span></div>
                                        <div class="text-light mb-0">Mise: ${parseFloat(t.mise).toFixed(2)} | Cote: X${parseFloat(t.total_cote).toFixed(2)}</div>
                                        <div class="fw-bold ${badgeColor} mb-1">Gain: +${parseFloat(t.gain).toFixed(2)} TND</div>
                                        <span class="badge border border-secondary py-1 px-2 text-uppercase ${badgeColor}" style="background-color: #040a18; font-size: 0.6rem;">${t.status}</span>
                                    </div>
                                </div>`;
                        });
                    }
                }

                if (allTicketsHtml === '') {
                    container.innerHTML = '<div class="bg-card-custom border-custom rounded-2 p-3 text-center text-secondary fw-bold" style="font-size: 0.75rem;">Aucun ticket actif.</div>';
                } else {
                    container.innerHTML = `<div class="d-flex flex-column overflow-y-auto" style="max-height: 450px;">${allTicketsHtml}</div>`;
                }
            } catch(e) {
                container.innerHTML = '<div class="text-center p-3 text-danger fw-bold" style="font-size: 0.75rem;">خطأ في الاتصال ❌</div>';
            }
        }

        function openPasswordModal() { 
            const myModal = new bootstrap.Modal(document.getElementById('passwordModal'));
            myModal.show();
        }
        
        async function submitNewPassword() {
            const new_password = document.getElementById('new-sys-pass').value;
            if(!new_password) return showNotification('Veuillez introduire un mot de passe!', 'error');
            const res = await fetch(`${BACKEND_URL}/api/user/change-password`, {
                method: 'POST', headers: getAuthHeaders(),
                body: JSON.stringify({ username: user.username, new_password })
            });
            if(res.ok) { 
                showNotification('Mot de passe mis à jour!'); 
                document.getElementById('new-sys-pass').value = '';
                bootstrap.Modal.getInstance(document.getElementById('passwordModal')).hide();
            }
        }

        function logout() { 
            localStorage.removeItem('alpha_user'); 
            localStorage.clear(); 
           window.location.href = '/';
        }

        function copySecretCode(secret, event) {
            event.stopPropagation(); 
            navigator.clipboard.writeText(secret).then(() => {
                showNotification(`تم نسخ الكود بنجاح: ${secret}`, 'success');
            }).catch(err => {
                showNotification('فشل في نسخ الكود!', 'error');
            });
        }
    </script>
</body>
